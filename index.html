<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全国住建机会点作战地图 · 六大区域中心</title>
  <meta name="description" content="覆盖全国 31 省的住建行业机会点作战地图，按公司六大区域中心分组：一中心华北/二中心华东/三中心西南/四中心东北/五中心华中南/六中心西北" />
  <link rel="stylesheet" href="./assets/css/theme.css">
  <link rel="stylesheet" href="./assets/css/home-overview.css">
  <link rel="stylesheet" href="./assets/css/data-importer.css">
  <!-- ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
  <div id="app" class="home-app">

    <!-- ============== Header ============== -->
    <header class="home-header">
      <div class="home-header-left">
        <div class="home-logo">六</div>
        <div class="home-title">
          <h1>全国住建机会点作战地图</h1>
          <p>SIX-NET BATTLE MAP · 六大区域中心 · 31 省覆盖</p>
        </div>
      </div>
      <div class="home-header-right">
        <!-- 搜索框 -->
        <div class="home-search">
          <input id="home-search-input" type="text" placeholder="搜索省份/拼音/简称..." autocomplete="off" />
          <div id="home-search-list" class="home-search-list"></div>
        </div>
        <!-- 下拉菜单 -->
        <div class="home-select">
          <select id="home-select"></select>
        </div>
        <!-- 中心 Tab -->
        <div id="home-center-tabs" class="home-center-tabs"></div>
        <!-- 切换 B 版沉浸式 -->
        <a class="home-immersive-link" href="./index-immersive.html" title="沉浸式大屏版">
          <span>沉浸式大屏</span>
          <span>→</span>
        </a>
      </div>
    </header>

    <!-- ============== 主区：三栏 ============== -->
    <main class="home-main">
      <!-- 左栏：六大中心卡片 -->
      <aside class="home-centers" id="home-centers"></aside>

      <!-- 中栏：全国矢量地图 -->
      <section class="home-map-wrap">
        <div class="home-map-head">
          <span class="title">全国作战地图</span>
          <div class="legend">
            <span class="lg-item" style="--c:var(--center-1);"><span class="lg-dot"></span>一中心</span>
            <span class="lg-item" style="--c:var(--center-2);"><span class="lg-dot"></span>二中心</span>
            <span class="lg-item" style="--c:var(--center-3);"><span class="lg-dot"></span>三中心</span>
            <span class="lg-item" style="--c:var(--center-4);"><span class="lg-dot"></span>四中心</span>
            <span class="lg-item" style="--c:var(--center-5);"><span class="lg-dot"></span>五中心</span>
            <span class="lg-item" style="--c:var(--center-6);"><span class="lg-dot"></span>六中心</span>
          </div>
        </div>
        <div class="home-map-container">
          <div id="home-map" style="width:100%;height:100%;"></div>
          <div id="home-map-loading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,24,48,0.7);color:var(--cyan-light);font-size:13px;letter-spacing:2px;z-index:20;">
            <span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(56,189,248,0.2);border-top-color:var(--cyan);border-radius:50%;animation:spin 1s linear infinite;margin-right:10px;"></span>
            加载全国矢量地图...
          </div>
        </div>
      </section>

      <!-- 右栏：中心统计 + 省份列表 -->
      <aside class="home-side">
        <div class="home-side-card" style="flex:1;">
          <div class="home-side-head" id="home-side-head"></div>
          <div class="home-side-body" id="home-side-body"></div>
        </div>
      </aside>
    </main>

    <!-- ============== 底部汇总条 ============== -->
    <footer class="home-footer">
      <div class="home-foot-stats" id="home-foot-stats"></div>
      <div class="home-foot-foot">
        已部署省份：<b id="foot-provinces">5</b> / 31 ·
        中心覆盖：<b id="foot-centers">5</b> / 6
      </div>
    </footer>

    <!-- ============== Toast ============== -->
    <div class="home-toast" id="home-toast"></div>
  </div>

  <style>
    @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  </style>

  <!-- ============== 配置文件 ============== -->
  <script src="./assets/js/config/centers.config.js"></script>
  <script src="./assets/js/config/provinces.config.js"></script>
  <script src="./assets/js/config/domains.config.js"></script>

  <!-- ============== 5 省数据（同步加载，PROVINCE_DATA 填充） ============== -->
  <script src="./provinces/data/liaoning-data.js"></script>
  <script src="./provinces/data/fujian-data.js"></script>
  <script src="./provinces/data/hubei-data.js"></script>
  <script src="./provinces/data/shaanxi-data.js"></script>
  <script src="./provinces/data/sichuan-data.js"></script>

  <!-- ============== 全国汇总 ============== -->
  <script src="./data/national-summary.js"></script>

  <!-- ============== A 版 App ============== -->
  <script src="./assets/js/vendor/sheetjs.min.js"></script>
  <script src="./assets/js/core/data-importer.js"></script>
  <script src="./assets/js/core/national-app.js"></script>
</body>
</html>
